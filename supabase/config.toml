# Local sandbox only. No hosted production project is linked.
project_id = "codezero-workspace-sandbox"
[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000
[db]
port = 54322
shadow_port = 54320
major_version = 17
[db.migrations]
# The copied repository lacks the original MVP schema. Restore that schema
# in a fresh local database before manually applying this additive migration.
enabled = false
[db.seed]
enabled = false
sql_paths = []
[local_smtp]
enabled = true
port = 54324
smtp_port = 54325
pop3_port = 54326
[auth]
enabled = true
site_url = "http://127.0.0.1:3000"
additional_redirect_urls = ["http://127.0.0.1:3000/auth/invite**"]
enable_signup = true
enable_anonymous_sign_ins = false
minimum_password_length = 12
[auth.email]
enable_signup = true
enable_confirmations = true
[auth.email.template.invite]
subject = "CodeZero: invitación de prueba"
content_path = "./supabase/templates/invite.html"
