rules:
  - id: codezero-no-eval
    languages: [javascript, typescript]
    severity: ERROR
    message: Avoid dynamic code execution; validate input and use explicit operations.
    pattern-either:
      - pattern: eval(...)
      - pattern: new Function(...)
  - id: codezero-no-shell-execution
    languages: [javascript, typescript]
    severity: ERROR
    message: Shell execution requires security review; use argument arrays without a shell.
    pattern-either:
      - pattern: exec(...)
      - pattern: execSync(...)
      - pattern: $CP.exec(...)
      - pattern: $CP.execSync(...)
      - pattern: 'spawn(..., { ..., shell: true, ... })'
      - pattern: '$CP.spawn(..., { ..., shell: true, ... })'
  - id: codezero-no-raw-html
    languages: [javascript, typescript]
    severity: ERROR
    message: Raw HTML rendering requires an explicit sanitization review.
    pattern-either:
      - pattern: '<$TAG ... dangerouslySetInnerHTML={$VALUE} ... />'
      - pattern: $NODE.innerHTML = $VALUE
      - pattern: $NODE.insertAdjacentHTML(...)
  - id: codezero-tls-validation
    languages: [javascript, typescript]
    severity: ERROR
    message: Do not disable TLS certificate verification.
    pattern-either:
      - pattern: process.env.NODE_TLS_REJECT_UNAUTHORIZED = "0"
      - pattern: '{ ..., rejectUnauthorized: false, ... }'
  - id: codezero-no-public-server-secret
    languages: [javascript, typescript]
    severity: ERROR
    message: Server credentials must never use a NEXT_PUBLIC environment variable.
    patterns:
      - pattern: process.env.$NAME
      - metavariable-regex:
          metavariable: $NAME
          regex: '^NEXT_PUBLIC_.*(SECRET|SERVICE_ROLE|PRIVATE_KEY|STRIPE_KEY|OPENAI_KEY|OPENAI_API_KEY)'
  - id: codezero-no-unverified-jwt
    languages: [javascript, typescript]
    severity: ERROR
    message: Do not disable signature verification for authentication tokens.
    pattern-either:
      - pattern: '{ ..., verify_signature: false, ... }'
      - pattern: '{ ..., algorithms: ["none"], ... }'
