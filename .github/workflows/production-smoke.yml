name: Production smoke

on:
  workflow_dispatch:
  schedule:
    - cron: "17 12 * * *"

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Check production
        env:
          BASE_URL: https://codezero-nine.vercel.app
        run: node scripts/smoke.mjs
