name: CodeZero Security

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "31 13 * * 1"

permissions:
  contents: read

concurrency:
  group: codezero-security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  security:
    name: Security checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install pinned security tools
        run: python -m pip install -r .security/requirements.txt
      - name: Validate security rules
        env:
          SEMGREP_SEND_METRICS: "off"
          SEMGREP_ENABLE_VERSION_CHECK: "0"
        run: semgrep scan --validate --config .security/semgrep.yml --metrics off --disable-version-check
      - name: Static application security checks
        env:
          SEMGREP_SEND_METRICS: "off"
          SEMGREP_ENABLE_VERSION_CHECK: "0"
        run: semgrep scan --config .security/semgrep.yml --metrics off --disable-version-check --error --strict app lib
      - name: Test security rules against safe and unsafe fixtures
        env:
          SEMGREP_SEND_METRICS: "off"
          SEMGREP_ENABLE_VERSION_CHECK: "0"
        run: semgrep scan --test --config .security/semgrep.yml --metrics off --disable-version-check .security/semgrep.tsx
      - name: Scan current files for secrets
        run: python scripts/security-secrets.py
      - name: Install dependencies without lifecycle scripts
        run: npm ci --ignore-scripts
      - name: Audit all dependency severities
        run: npm audit --audit-level=low
