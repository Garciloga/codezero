name: CodeZero CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: codezero-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Dependency security audit
        run: npm audit --audit-level=high

      - name: Unit tests
        run: npm test

      - name: Enterprise scope database checks
        run: node scripts/workspace-db-check.mjs

      - name: Account personalization database checks
        run: node scripts/account-personalization-db-check.mjs

      - name: Company permissions, capacity and channels database checks
        run: CODEZERO_OWNER_SEATS_CHECK=1 node scripts/company-teams-db-check.mjs

      - name: Community and mentoring permissions and booking checks
        run: node scripts/social-workflows-db-check.mjs

      - name: Owner support, deletion and mentoring checks
        run: node scripts/owner-support-db-check.mjs

      - name: Mixed role routes database checks
        run: node scripts/mixed-role-db-check.mjs

      - name: Development plans and notices scope checks
        run: node scripts/growth-db-check.mjs

      - name: Platform usage isolation and aggregation checks
        run: node scripts/platform-usage-db-check.mjs

      - name: Position progression and project gate checks
        run: node scripts/position-db-check.mjs

      - name: Verify graded learning SQL RPCs on isolated PostgreSQL
        run: node scripts/verified-learning-rpc-db-check.mjs

      - name: Section catalog budgets
        run: node scripts/localization-sections.mjs

      - name: Visible brand guard
        run: node scripts/brand-audit.mjs

      - name: Suggestions permissions and workflows
        run: node scripts/suggestions-db-check.mjs

      - name: Published position curriculum audit
        run: npm run audit:curriculum

      - name: Translation coverage
        run: node scripts/localization-audit.mjs

      - name: Support workflow database checks
        run: node scripts/support-workflow-db-check.mjs

      - name: Learning route and database checks
        run: node scripts/learning-flow-route-check.mjs && node scripts/learning-integrations-db-check.mjs

      - name: Customer Success database checks
        run: node scripts/customer-success-db-check.mjs

      - name: Role-training sandbox database checks
        run: CODEZERO_PROFESSIONAL_ROUTES_CHECK=1 node scripts/role-training-db-check.mjs

      - name: Registration and recovery database checks
        run: node scripts/profile-registration-db-check.mjs && node scripts/recovery-local-check.mjs

      - name: Migration baseline integrity and recovery
        run: node scripts/migration-baseline-check.mjs

      - name: Build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_placeholder
          SUPABASE_SECRET_KEY: sb_secret_ci_placeholder
        run: npm run build



  browsers:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        engine: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm ci --prefix sandbox-runtime
      - name: Install browser
        run: npx --prefix sandbox-runtime playwright install --with-deps ${{ matrix.engine }}
      - name: Build fixture target
        env:
          NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:5456
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: validation-placeholder
          SUPABASE_SECRET_KEY: validation-placeholder
          NEXT_PUBLIC_APP_URL: http://localhost:3256
        run: npm run build
      - name: Language, support and accessibility browser checks
        env:
          CODEZERO_REVIEW_BUILT: '1'
          CODEZERO_BROWSER_ENGINE: ${{ matrix.engine }}
        run: node scripts/localization-browser-check.mjs

      - name: Community and mentoring browser workflows
        env:
          CODEZERO_BROWSER_ENGINE: ${{ matrix.engine }}
        run: node scripts/social-workflows-browser-check.mjs

      - name: Mixed role routes browser workflows
        env:
          CODEZERO_BROWSER_ENGINE: ${{ matrix.engine }}
        run: node scripts/mixed-role-browser-check.mjs

      - name: Role-training sandbox browser flow
        env:
          CODEZERO_BROWSER_ENGINE: ${{ matrix.engine }}
        run: node scripts/role-training-browser-check.mjs

      - name: Build isolated runtime review target
        if: matrix.engine == 'chromium'
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: validation-placeholder
          NEXT_PUBLIC_APP_URL: http://localhost:3032
          CODEZERO_ENVIRONMENT: sandbox
          CODEZERO_PRACTICE_PREVIEW: '1'
          CODEZERO_MODULAR_PREVIEW: '1'
          CODEZERO_CODE_RUNTIME: '1'
          CODEZERO_CODE_RUNTIME_ORIGIN: http://127.0.0.1:3041
        run: npm run build

      - name: Execute Python and SQL in isolated browser workers
        if: matrix.engine == 'chromium'
        run: node scripts/browser-practice-check.mjs



